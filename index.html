<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="chat.css">
<title>チャット実験</title>
</head>

<body>
<div class="container">

<div id="screen1" class="screen active">
<h2>実験の説明</h2>
<p>これは架空のテキストチャットを体験する課題です。</p>
<button onclick="next(2)">次へ</button>
</div>

<div id="screen2" class="screen">
<h2>登録</h2>
<input id="name" placeholder="名前"><br><br>
<select id="gender">
<option value="male">男性</option>
<option value="female">女性</option>
</select><br><br>
<button onclick="startChat()">開始</button>
</div>

<div id="screen3" class="screen">
<div class="chat-box" id="chat"></div>
<div id="choices"></div>

<div class="input-area">
<input id="input" placeholder="入力してください">
<button onclick="sendInput()">送信</button>
</div>
</div>

<div id="screen5" class="screen">
<h2>追加の課題</h2>
<p>追加の課題を行いますか？</p>

<div id="choiceBlock">
<button onclick="selectFinal()">はい</button>
<button onclick="selectFinal()">いいえ</button>
<button onclick="selectFinal()">都合が悪いのでいいえ</button>
</div>

<div id="resultBlock" style="display:none;">
<p id="partnerReply"></p>
<button onclick="goToForm()">OK</button>
</div>
</div>

<div id="screen4" class="screen">
<h2>質問に回答してください</h2>
<p><a id="formLink" href="#">質問フォームへ</a></p>
</div>

</div>

<script>
function flow(){
  if(phase === 0){
    // ユーザーが最初の質問に答えた後
    setTimeout(()=>{
      addMsg("よろしくお願いします！",'partner');
      showChoices(); // 最初の質問ボタン選択
    },800);
  }

  else if(phase === 1){
    // ユーザーがボタン選択＋自由入力（1つ目の質問）後
    setTimeout(()=>{
      addMsg("そうなんですね！",'partner');        // 相手反応
    },800);

    setTimeout(()=>{
      addMsg("相手が質問を選んでいます…",'system'); // 相手が質問選択中
    },1600);

    setTimeout(()=>{
      addMsg("趣味は何ですか？",'partner');         // 相手質問
      setInputMode("free");                           // 自由入力に切り替え
      phase++;                                        // 次のユーザー入力でphase=2
    },2400);
  }

  else if(phase === 2){
    // ユーザーが趣味を入力した後
    setTimeout(()=>{
      addMsg("私は映画を見るのが好きです",'partner'); // 相手返答
      showChoices();                                   // 次の質問ボタン選択
    },800);
    phase++;  // phase=3 次のボタン選択で進む
  }

  else if(phase === 3){
    // ユーザーがボタン選択＋自由入力（2つ目の質問）後
    setTimeout(()=>{
      addMsg("なるほど",'partner');
      addMsg("もう時間みたいです…",'system');

      setTimeout(()=>{
        const msg = condition.liking === 'high'
          ? '今日はありがとう、あなたと話すのはとても楽しかった！'
          : '今日はありがとう！';

        addMsg(msg,'partner');

        setInputMode("free"); // 最後の自由入力
        addMsg("最後にメッセージを送ってください",'system');

        isFinal = true;  // 送信後は終了処理
      },800);
    },800);
  }
}

// sendInput も修正不要、isFinal判定のタイミングで終了
function sendInput(){
  const val = document.getElementById('input').value;
  if(!val) return;

  addMsg(val,'user');
  document.getElementById('input').value = "";

  if(isFinal){
    setTimeout(()=>{
      addMsg("チャットを終了します",'system');
      setTimeout(()=> next(5),1500); // 追加課題画面に戻る
    },800);
    return;
  }

  flow();
}
</script>

</body>
</html>
