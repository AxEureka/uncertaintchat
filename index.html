<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="chat.css">
<title>チャット実験</title>
</head>

<body>
<div class="container">

<!-- 説明 -->
<div id="screen1" class="screen active">
<h2>実験の説明</h2>
<p>これは架空のテキストチャットを体験する課題です。</p>
<button onclick="next(2)">次へ</button>
</div>

<!-- 登録 -->
<div id="screen2" class="screen">
<h2>登録</h2>
<input id="name" placeholder="名前"><br><br>
<select id="gender">
<option value="male">男性</option>
<option value="female">女性</option>
</select><br><br>
<button onclick="startChat()">開始</button>
</div>

<!-- チャット -->
<div id="screen3" class="screen">
<div class="chat-box" id="chat"></div>
<div id="choices"></div>

<div class="input-area" id="inputArea">
<input id="input" placeholder="何かメッセージを送ってください">
<button onclick="sendInput()">送信</button>
</div>
</div>

<!-- 追加課題 -->
<div id="screen5" class="screen">
<h2>追加の課題</h2>
<p>追加の課題を行いますか？</p>

<div id="choiceBlock">
<button onclick="selectFinal('yes')">はい</button>
<button onclick="selectFinal('no')">いいえ</button>
<button onclick="selectFinal('busy')">都合が悪いのでいいえ</button>
</div>

<div id="resultBlock" style="display:none;">
<p id="partnerReply"></p>
<button onclick="goToForm()">OK</button>
</div>
</div>

<!-- フォーム -->
<div id="screen4" class="screen">
<h2>質問に回答してください</h2>
<p><a id="formLink" href="#">質問フォームへ</a></p>
</div>

</div>

<script>
let phase = 0;
let userName = "";
let firstChoice = null;
let secondChoice = null;

const participantId = "P" + Date.now() + Math.floor(Math.random()*1000);

let condition = {
  liking: Math.random() < 0.5 ? "high" : "low",
  certainty: Math.random() < 0.5 ? "certain" : "uncertain"
};

function next(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen'+n).classList.add('active');
}

function setInputMode(mode){
  const input = document.getElementById('input');

  if(mode === "free"){
    input.disabled = false;
    input.placeholder = "入力してください";
  }else{
    input.disabled = true;
    input.placeholder = "質問を選んでください";
  }
}

function addMsg(text, cls){
  const div = document.createElement('div');
  div.className = 'msg '+cls;
  div.innerText = text;
  document.getElementById('chat').appendChild(div);
  div.scrollIntoView();
}

function startChat(){
  userName = document.getElementById('name').value;
  const gender = document.getElementById('gender').value;

  if(userName.length < 1){
    alert("名前を入力してください");
    return;
  }

  // 👇ここ追加
  partnerName = gender === "male" ? "アヤ" : "リョウ";

  next(3);

  setTimeout(()=>{
    addMsg(`こんにちは、${partnerName}です。`, 'partner');
  },800);

  setTimeout(()=>{
    addMsg(`${userName}さんですか？`, 'partner');
    setInputMode("free");
  },1800);
};
}

function sendInput(){
  const val = document.getElementById('input').value;
  if(val.length < 1) return;

  addMsg(val,'user');
  document.getElementById('input').value='';

  handleFlow(val);
}

function handleFlow(val){

  // ① 最初の返答
  if(phase === 0){
    setTimeout(()=>{
      addMsg("よろしくお願いします！",'partner');
      showChoices();
    },800);
    phase++;
  }

  // ② 相手の逆質問後の自由入力
  else if(phase === 2){
    setTimeout(()=>{
      addMsg("そうなんですね！",'partner');
      addMsg("趣味は何ですか？",'partner');
      setInputMode("free");
    },800);
    phase++;
  }

  // ③ 趣味回答
  else if(phase === 3){
    setTimeout(()=>{
      addMsg("私は映画を見るのが好きです",'partner');
      showChoices();
    },800);
    phase++;
  }

  // ④ 2回目逆質問
  else if(phase === 5){
    setTimeout(()=>{
      addMsg("なるほど",'partner');
      addMsg("あと1ターンで終了します。",'system');

      setTimeout(()=>{
        const msg = condition.liking === 'high'
          ? '今日はありがとう、あなたと話すのはとても楽しかった！'
          : '今日はありがとう！';
      
        addMsg(msg,'partner');
      
        // 👇ここに入れる！！
        setInputMode("choice");
      
        setTimeout(()=>{
          addMsg("最後にメッセージを送ってください",'system');
      
          // 👇0.5秒後に入力解放
          setTimeout(()=>{
            setInputMode("free");
          },500);
      
        },800);
      
      },800);

  // ⑤ 最後
  else if(phase === 6){
    setTimeout(()=>{
      addMsg("チャットを終了します",'system');
      setTimeout(()=> next(5),1500);
    },800);
  }
}

function showChoices(){
  const div = document.getElementById('choices');
  div.innerHTML = '';

  setInputMode("choice");

  let options;

  if(!firstChoice){
    options = [
      {text:"週末なにしてる？", key:"weekend"},
      {text:"恋人にするならどんな人？", key:"type"}
    ];
  }else{
    options = [
      {text: secondChoice === 'weekend' ? "週末なにしてる？" : "恋人にするならどんな人？", key: secondChoice}
    ];
  }

  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.innerText = opt.text;

    btn.onclick = ()=>{
      addMsg(opt.text,'user');
      div.innerHTML='';

      if(!firstChoice){
        firstChoice = opt.key;
        secondChoice = opt.key === 'weekend' ? 'type' : 'weekend';
      }

      setTimeout(()=>{
        addMsg(getReply(opt.key),'partner');
        addMsg(`${userName}さんは？`,'partner');
        setInputMode("free");
      },800);

      phase++;
    };

    div.appendChild(btn);
  });
}

function getReply(key){
  if(key === 'weekend') return "友達とご飯行ったりすることが多いかな！";
  if(key === 'type') return "私を楽しませてくれる人、笑わせてくれる人がいいなって思う！";
}

function selectFinal(choice){
  document.getElementById('choiceBlock').style.display = 'none';

  const reply = condition.certainty === 'certain'
    ? '相手の回答：はい'
    : '相手の回答：都合が悪いのでいいえ';

  document.getElementById('partnerReply').innerText = reply;
  document.getElementById('resultBlock').style.display = 'block';
}

function goToForm(){
  next(4);

  const url = `https://docs.google.com/forms/d/e/1FAIpQLScU0aHR0LlC2TCniUz0ZhXG-ULv-AXwBzvXxuTjb34hJa6mNQ/viewform?usp=pp_url&entry.1787887357=${participantId}`;

  document.getElementById('formLink').href = url;
}
</script>

</body>
</html>
