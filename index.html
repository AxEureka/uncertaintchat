<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="chat.css">
<title>チャット実験</title>
</head>

<body>
<div class="container">

<div id="screen1" class="screen active">
<h2>実験の説明</h2>
<p>これは架空のテキストチャットを体験する課題です。</p>
<button onclick="next(2)">次へ</button>
</div>

<div id="screen2" class="screen">
<h2>登録</h2>
<input id="name" placeholder="名前"><br><br>
<select id="gender">
<option value="male">男性</option>
<option value="female">女性</option>
</select><br><br>
<button onclick="startChat()">開始</button>
</div>

<div id="screen3" class="screen">
<div class="chat-box" id="chat"></div>
<div id="choices"></div>

<div class="input-area">
<input id="input" placeholder="入力してください">
<button onclick="sendInput()">送信</button>
</div>
</div>

<div id="screen5" class="screen">
<h2>追加の課題</h2>
<p>追加の課題を行いますか？</p>

<div id="choiceBlock">
<button onclick="selectFinal()">はい</button>
<button onclick="selectFinal()">いいえ</button>
<button onclick="selectFinal()">都合が悪いのでいいえ</button>
</div>

<div id="resultBlock" style="display:none;">
<p id="partnerReply"></p>
<button onclick="goToForm()">OK</button>
</div>
</div>

<div id="screen4" class="screen">
<h2>質問に回答してください</h2>
<p><a id="formLink" href="#">質問フォームへ</a></p>
</div>

</div>

<script>
let phase = 0;
let userName = "";
let partnerName = "";
let firstChoice = null;
let secondChoice = null;
let isFinal = false;

const participantId = "P" + Date.now() + Math.floor(Math.random()*1000);

let condition = {
  liking: Math.random() < 0.5 ? "high" : "low",
  certainty: Math.random() < 0.5 ? "certain" : "uncertain"
};

function next(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen'+n).classList.add('active');
}

// モード切替＋systemメッセージ表示
function setInputMode(mode){
  const input = document.getElementById('input');
  input.disabled = (mode !== "free");
  input.placeholder = mode === "free" ? "入力してください" : "質問を選んでください";

  if(mode === "free"){
    addMsg("回答を入力してください。", "system");
  }else if(mode === "choice"){
    addMsg("質問を選んでください。", "system");
  }
}

function addMsg(text, cls){
  const div = document.createElement('div');
  div.className = 'msg '+cls;
  div.innerText = text;
  document.getElementById('chat').appendChild(div);
  div.scrollIntoView();
}

function startChat(){
  userName = document.getElementById('name').value;
  const gender = document.getElementById('gender').value;
  if(!userName){ alert("名前を入力してください"); return; }

  partnerName = gender === "male" ? "アヤ" : "リョウ";

  next(3);

  setTimeout(()=> addMsg(`こんにちは、${partnerName}です。`, 'partner'),800);
  setTimeout(()=>{
    addMsg(`${userName}さんですか？`, 'partner');
    setInputMode("free");
  },1800);
}

function sendInput(){
  const val = document.getElementById('input').value;
  if(!val) return;

  addMsg(val,'user');
  document.getElementById('input').value = "";

  if(isFinal){
    setTimeout(()=>{
      addMsg("チャットを終了します",'system');
      setTimeout(()=> next(5),1500);
    },800);
    return;
  }

  flow();
}
  
function flow(){

  if(phase === 0){
    setTimeout(()=>{
      addMsg("よろしくお願いします！",'partner');
      showChoices();
    },800);
  }

  else if(phase === 1){
    // phase 1: ユーザーが1つ目の質問に答えた後、相手のターン
    setTimeout(()=>{
      addMsg("そうなんですね！",'partner');
    },800);

    setTimeout(()=>{
      addMsg("相手が質問を選んでいます…",'system');
    },1600);

    setTimeout(()=>{
      addMsg("趣味は何ですか？",'partner');
      setInputMode("free");   // 自由入力に切り替え
      // この時点では phase は進めない
    },2400);
  }

  else if(phase === 2){
    // phase 2: ユーザーが「趣味は何ですか？」に答えた後
    setTimeout(()=>{
      addMsg("私は映画を見るのが好きです",'partner');
      showChoices(); // 2つ目の質問を選ばせる
      phase++;       // この時点で phase を進める
    },800);
  }

  else if(phase === 3){
    // phase 3: 最後のまとめ
    setTimeout(()=>{
      addMsg("なるほど",'partner');
      addMsg("もう時間みたいです…",'system');

      setTimeout(()=>{
        const msg = condition.liking === 'high'
          ? '今日はありがとう、あなたと話すのはとても楽しかった！'
          : '今日はありがとう！';

        addMsg(msg,'partner');

        setInputMode("choice");

        setTimeout(()=>{
          addMsg("最後にメッセージを送ってください",'system');
          isFinal = true;

          setTimeout(()=> setInputMode("free"),500);
        },800);

      },800);

    },800);
  }
}
function showChoices(){
  const div = document.getElementById('choices');
  div.innerHTML = '';
  setInputMode("choice");

  let options;
  if(!firstChoice){
    options = [
      {text:"週末なにしてる？", key:"weekend"},
      {text:"恋人にするならどんな人？", key:"type"}
    ];
  }else{
    options = [
      {text: secondChoice === 'weekend' ? "週末なにしてる？" : "恋人にするならどんな人？", key: secondChoice}
    ];
  }

  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.innerText = opt.text;

    btn.onclick = ()=>{
      addMsg(opt.text,'user');
      div.innerHTML='';

      if(!firstChoice){
        firstChoice = opt.key;
        secondChoice = opt.key === 'weekend' ? 'type' : 'weekend';
      }

      setTimeout(()=>{
        addMsg(getReply(opt.key),'partner');
        addMsg(`${userName}さんは？`,'partner');
        setInputMode("free");
      },800);

      phase++;
    };

    div.appendChild(btn);
  });
}

function getReply(key){
  return key === 'weekend'
    ? "友達とご飯行ったりすることが多いかな！"
    : "私を楽しませてくれる人、笑わせてくれる人がいいなって思う！";
}

function selectFinal(){
  document.getElementById('choiceBlock').style.display = 'none';
  const reply = condition.certainty === 'certain'
    ? '相手の回答：はい'
    : '相手の回答：都合が悪いのでいいえ';
  document.getElementById('partnerReply').innerText = reply;
  document.getElementById('resultBlock').style.display = 'block';
}

function goToForm(){
  next(4);
  const url = `https://docs.google.com/forms/d/e/1FAIpQLScU0aHR0LlC2TCniUz0ZhXG-ULv-AXwBzvXxuTjb34hJa6mNQ/viewform?usp=pp_url&entry.1787887357=${participantId}`;
  document.getElementById('formLink').href = url;
}
</script>

</body>
</html>
